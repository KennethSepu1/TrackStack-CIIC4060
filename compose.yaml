services:
  db:
    image: postgis/postgis:17-3.5
    platform: linux/amd64
    environment:
      POSTGRES_DB: ciic4060_test
      POSTGRES_USER: etl_test
      POSTGRES_PASSWORD: local_test_only
    ports:
      - "127.0.0.1:55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etl_test -d ciic4060_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - ./tests/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
